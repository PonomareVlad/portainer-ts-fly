# fly.toml app configuration file generated for portainer-ts-fly on 2026-03-07T20:10:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'portainer-ts-fly'
primary_region = 'fra'
swap_size_mb = 256

[[restart]]
  policy = "always"

[[vm]]
  cpus = 1
  memory_mb = 256
  memory = '256mb'
  cpu_kind = 'shared'
  size = 'shared-cpu-1x'
  persist_rootfs = "always"

[deploy]
  strategy = "immediate"
