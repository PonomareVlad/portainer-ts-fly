app = "portainer-ts-fly"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = 10

[env]
  PORT = "41641"

[[services]]
  protocol = "udp"
  internal_port = 41641
  auto_stop_machines = "off"
  auto_start_machines = false

  [[services.ports]]
    port = 41641

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 75

[[restart]]
  policy = "always"
  retries = 3

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  strategy = "immediate"

[mounts]
  source = "portainer_data"
  destination = "/data"
